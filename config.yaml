  # If true, anything reading as remote passes the location gate.
  allow_remote: true

  # Drop postings older than this. Set to null to disable.
  # Boards often re-stamp `updated_at`, so this is a soft signal, not a promise.
  max_age_days: 30


# --- LLM stages -------------------------------------------------------------

screen_batch_size: 8
screen_jd_chars: 1400
draft_jd_chars: 6000
score_threshold: 5.0
max_per_digest: 5


# --- paths ------------------------------------------------------------------

companies_file: companies.yaml
profile_file: profile.json
seen_file: seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv
channel_seen_file: channel_seen.json
# --- public IT channel ------------------------------------------------------
# This mode includes IT roles at every experience level. It does not use the
# resume score or exclude senior/lead/manager titles.
channel:
  enabled: true
  it_keywords:
    - software
    - developer
    - engineer
    - programmer
    - qa
    - tester
    - testing
    - devops
    - cloud
    - data
    - artificial intelligence
    - machine learning
    - cybersecurity
    - security analyst
    - network
    - database
    - technical support
    - it support
    - helpdesk
    - frontend
    - backend
    - full stack
    - mobile
    - automation
    - site reliability
    - technical writer
  output_dir: out/channel
  hashtags:
    - '#ITJobs'
    - '#Hiring'
    - '#TechJobs'
    - '#Career'
